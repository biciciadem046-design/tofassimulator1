<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tofaş Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #000}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}
.panel{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 11px;backdrop-filter:blur(5px)}
#speed{font-size:28px;font-weight:bold}
#gear{font-size:22px}
.bar{width:120px;height:9px;background:#333;border-radius:10px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:100%;background:#54d46a}
#fuelFill{background:#f3c64b}
#damageFill{background:#e54d4d}
#buttons{position:absolute;right:12px;top:75px;display:grid;grid-template-columns:repeat(2,56px);gap:8px;pointer-events:auto}
.uiBtn{width:56px;height:48px;border:1px solid #ffffff33;border-radius:12px;background:#0009;color:white;font-weight:bold}
.uiBtn:active,.control:active{transform:scale(.94);background:#ffffff33}
#message{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#000b;display:none}
#controls{position:absolute;inset:auto 0 12px 0;height:190px;pointer-events:none}
.control{position:absolute;pointer-events:auto;border:1px solid #ffffff30;color:white;background:#0008;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;user-select:none}
#left{left:18px;bottom:55px;width:70px;height:70px}
#right{left:98px;bottom:55px;width:70px;height:70px}
#brake{right:105px;bottom:45px;width:76px;height:76px;background:#6b1f1fcc}
#gas{right:20px;bottom:72px;width:76px;height:76px;background:#174e28cc}
#clutch{left:178px;bottom:25px;width:58px;height:58px}
#handbrake{left:250px;bottom:35px;width:58px;height:58px}
#gearbox{position:absolute;left:18px;bottom:15px;display:flex;gap:4px;pointer-events:auto}
.gear{width:40px;height:38px;border:1px solid #fff3;background:#000b;color:white;border-radius:8px}
#menu{position:fixed;inset:0;background:rgba(5,7,10,.92);color:white;display:none;z-index:20;padding:24px;overflow:auto}
#menu h1{margin-top:0}
.card{background:#151a21;border:1px solid #ffffff18;border-radius:15px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.action{border:0;border-radius:9px;padding:10px 14px;background:#e5e7eb;color:#111;font-weight:bold}
input[type=range]{width:150px}
#garageCars{display:flex;gap:8px;flex-wrap:wrap}
.carChoice{padding:10px;border:1px solid #fff3;border-radius:10px;background:#0d1116;color:white}
@media(max-width:600px){
 #buttons{top:70px}
 #gearbox{left:18px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="panel"><div id="speed">0 km/h</div><div id="gear">N</div></div>
    <div class="panel">
      <div>Yakıt</div><div class="bar"><div id="fuelFill" class="fill"></div></div>
      <div>Hasar</div><div class="bar"><div id="damageFill" class="fill"></div></div>
      <div id="money">₺ 10.000</div>
    </div>
  </div>
  <div id="buttons">
    <button class="uiBtn" id="lights">FAR</button>
    <button class="uiBtn" id="signal">SİNYAL</button>
    <button class="uiBtn" id="weather">HAVA</button>
    <button class="uiBtn" id="garage">GARAJ</button>
    <button class="uiBtn" id="camera">KAMERA</button>
    <button class="uiBtn" id="horn">KORNA</button>
  </div>
  <div id="message"></div>
  <div id="controls">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
    <div class="control" id="clutch">DEB</div>
    <div class="control" id="handbrake">ELF</div>
    <div class="control" id="brake">FREN</div>
    <div class="control" id="gas">GAZ</div>
    <div id="gearbox">
      <button class="gear" data-g="R">R</button><button class="gear" data-g="1">1</button>
      <button class="gear" data-g="2">2</button><button class="gear" data-g="3">3</button>
      <button class="gear" data-g="4">4</button><button class="gear" data-g="5">5</button>
      <button class="gear" data-g="N">N</button>
    </div>
  </div>
</div>

<div id="menu">
<h1>🚗 Tofaş Simulator</h1>
<div class="card">
  <b>Garaj</b>
  <div id="garageCars"></div>
</div>
<div class="card">
  <b>Modifiye</b>
  <div class="row">Motor <button class="action" onclick="upgrade('engine')">Yükselt ₺2.000</button></div>
  <div class="row">Fren <button class="action" onclick="upgrade('brake')">Yükselt ₺1.500</button></div>
  <div class="row">Lastik <button class="action" onclick="upgrade('tire')">Yükselt ₺1.200</button></div>
  <div class="row">Süspansiyon <button class="action" onclick="upgrade('suspension')">Yükselt ₺1.800</button></div>
  <div class="row">Boya <input id="paint" type="color" value="#d8c3a5" onchange="paintCar(this.value)"></div>
</div>
<div class="card">
  <b>Kontrol</b>
  <div class="row">Ekran kaydırma hassasiyeti <input id="sens" type="range" min=".3" max="3" step=".1" value="1"></div>
  <div class="row">Kamera tersliği <button class="action" onclick="reverseCamera()">Değiştir</button></div>
</div>
<div class="card">
  <b>Görevler</b>
  <p>Şehirde sür, yakıt istasyonuna git, belirlenen bölgelere ulaş ve para kazan.</p>
  <button class="action" onclick="startMission()">Rastgele Görev Başlat</button>
</div>
<button class="action" onclick="closeMenu()">Oyuna Dön</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
'use strict';

/* =========================
   TOFAŞ SIMULATOR - CORE
   ========================= */
const state={
  money:10000, fuel:100, damage:0, gear:'N', speed:0,
  steering:0, throttle:0, brake:0, clutch:false, handbrake:false,
  lights:false, signal:false, weather:'clear', cameraMode:0,
  cameraSensitivity:1, cameraReverse:false, mission:null,
  upgrades:{engine:0,brake:0,tire:0,suspension:0}, paint:'#d8c3a5',
  model:'Şahin'
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b5dc);
scene.fog=new THREE.Fog(0x82b5dc,70,360);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById('game').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x405060,1.3); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.7); sun.position.set(100,150,80); sun.castShadow=true; scene.add(sun);

const world=new THREE.Group(); scene.add(world);
const roadGroup=new THREE.Group(); world.add(roadGroup);
const trafficGroup=new THREE.Group(); world.add(trafficGroup);

function box(w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.75}));
 m.castShadow=true;m.receiveShadow=true;return m;
}
function cylinder(r,h,color,segments=16){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),new THREE.MeshStandardMaterial({color,roughness:.7}));
 m.castShadow=true;m.receiveShadow=true;return m;
}

/* Ground */
const ground=box(700,.2,700,0x3e703e); ground.position.y=-.2; world.add(ground);

/* Roads */
function road(x,z,w,d){
 const r=box(w,.12,d,0x292c31);r.position.set(x,0,z);roadGroup.add(r);
 const lineMat=new THREE.MeshBasicMaterial({color:0xf2e6a6});
 for(let i=-Math.floor(d/10);i<Math.floor(d/10);i++){
   const l=box(.12,.02,5,0xf2e6a6);l.position.set(x,.08,z+i*10);roadGroup.add(l);
 }
}
road(0,0,16,620);
road(0,0,620,16);
road(-110,0,10,620); road(110,0,10,620);
road(0,-110,620,10); road(0,110,620,10);

/* Buildings */
for(let x=-280;x<=280;x+=40){
 for(let z=-280;z<=280;z+=40){
   if(Math.abs(x)<20 || Math.abs(z)<20 || Math.abs(x-110)<20 || Math.abs(z-110)<20) continue;
   const h=8+Math.random()*28;
   const b=box(25,h,25, new THREE.Color().setHSL(Math.random(),.18,.45));
   b.position.set(x+(Math.random()*5-2.5),h/2,z+(Math.random()*5-2.5));world.add(b);
 }
}
/* Trees */
for(let i=0;i<130;i++){
 const x=(Math.random()-.5)*600,z=(Math.random()-.5)*600;
 if(Math.abs(x)<25||Math.abs(z)<25) continue;
 const trunk=cylinder(.7,4,0x70452a);trunk.position.set(x,2,z);
 const crown=cylinder(2.8,5,0x276b38);crown.position.set(x,6,z);
 world.add(trunk,crown);
}

/* Car */
const car=new THREE.Group(); world.add(car);
const body=box(2.1,.65,4.2,0xd8c3a5);body.position.y=.85;car.add(body);
const cabin=box(1.85,.75,2.15,0x26313b);cabin.position.set(0,1.35,-.15);car.add(cabin);
const hood=box(1.9,.18,1.15,0xc8b397);hood.position.set(0,1.13,1.45);car.add(hood);
const bumperF=box(2.25,.18,.25,0x22252a);bumperF.position.set(0,.55,2.1);car.add(bumperF);
const bumperR=box(2.25,.18,.25,0x22252a);bumperR.position.set(0,.55,-2.1);car.add(bumperR);
const wheels=[];
for(const x of [-1.08,1.08])for(const z of [-1.45,1.45]){
 const w=cylinder(.43,.28,0x111111,20);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);car.add(w);wheels.push(w);
}
const lightsFront=[];
for(const x of [-.65,.65]){
 const l=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.08),new THREE.MeshStandardMaterial({color:0xffffdd,emissive:0x000000}));
 l.position.set(x,1.0,2.11);car.add(l);lightsFront.push(l);
}
car.position.set(0,.05,30); car.rotation.y=Math.PI;
car.userData={velocity:0,heading:Math.PI};

/* Traffic */
const traffic=[];
function makeTraffic(i){
 const g=new THREE.Group();
 const b=box(1.8,.6,3.6,[0xb63a3a,0x2f65a9,0xd2a52f,0xeeeeee][i%4]);b.position.y=.7;g.add(b);
 const c=box(1.55,.55,1.7,0x26313b);c.position.y=1.2;g.add(c);
 g.position.set((i%2?5:-5),0, -240+i*45);g.userData.speed=7+Math.random()*7;g.userData.axis=i%2?'z':'x';
 trafficGroup.add(g);traffic.push(g);
}
for(let i=0;i<12;i++)makeTraffic(i);

/* Gas stations */
const station=new THREE.Group();
station.position.set(25,0,75);
const roof=box(18,1,10,0xd7d7d7);roof.position.y=6;station.add(roof);
for(const x of [-7,7]){const p=box(.5,6,.5,0xdddddd);p.position.set(x,3,0);station.add(p)}
const pump=box(1.5,2,1,0xe3e3e3);pump.position.set(0,1,2);station.add(pump);
world.add(station);

/* Mission marker */
const marker=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.2,32),new THREE.MeshBasicMaterial({color:0x22ff55}));
marker.position.set(70,.12,70);marker.visible=false;world.add(marker);

/* Rain */
const rainCount=900;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){rainPos[i*3]=(Math.random()-.5)*400;rainPos[i*3+1]=Math.random()*100;rainPos[i*3+2]=(Math.random()-.5)*400;}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaad9ff,size:.22,transparent:true,opacity:.65}));
rain.visible=false;scene.add(rain);

/* Input */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function bindHold(id,prop){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();state[prop]=1};
 const off=e=>{e.preventDefault();state[prop]=0};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindHold('gas','throttle');bindHold('brake','brake');
document.getElementById('left').addEventListener('pointerdown',()=>state.steering=-1);
document.getElementById('right').addEventListener('pointerdown',()=>state.steering=1);
for(const id of ['left','right'])document.getElementById(id).addEventListener('pointerup',()=>state.steering=0);
bindHold('clutch','clutch');bindHold('handbrake','handbrake');

document.querySelectorAll('.gear').forEach(b=>b.addEventListener('click',()=>state.gear=b.dataset.g));

/* Camera swipe */
let lastX=null;
renderer.domElement.addEventListener('pointerdown',e=>{lastX=e.clientX});
renderer.domElement.addEventListener('pointermove',e=>{
 if(lastX===null)return;
 const dx=e.clientX-lastX;
 if(Math.abs(dx)>1){ camera.rotation.y -= dx*.004*state.cameraSensitivity*(state.cameraReverse?-1:1); lastX=e.clientX; }
});
renderer.domElement.addEventListener('pointerup',()=>lastX=null);

/* UI */
function msg(t){const m=document.getElementById('message');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',1800)}
document.getElementById('lights').onclick=()=>{state.lights=!state.lights;lightsFront.forEach(l=>l.material.emissive.set(state.lights?0xffffcc:0x000000));msg(state.lights?'Farlar açık':'Farlar kapalı')};
document.getElementById('signal').onclick=()=>{state.signal=!state.signal;msg(state.signal?'Sinyal açık':'Sinyal kapalı')};
document.getElementById('weather').onclick=()=>{state.weather=state.weather==='clear'?'rain':'clear';rain.visible=state.weather==='rain';scene.fog.color.set(state.weather==='rain'?0x687582:0x82b5dc);msg(state.weather==='rain'?'Yağmur başladı':'Hava açtı')};
document.getElementById('camera').onclick=()=>{state.cameraMode=(state.cameraMode+1)%3;msg('Kamera: '+['Takip','Yakın','Uzak'][state.cameraMode])};
document.getElementById('horn').onclick=()=>msg('📣 Korna');
document.getElementById('garage').onclick=()=>openMenu();

function openMenu(){document.getElementById('menu').style.display='block';renderCars()}
function closeMenu(){document.getElementById('menu').style.display='none'}
function renderCars(){
 const el=document.getElementById('garageCars');el.innerHTML='';
 ['Şahin','Doğan','Kartal'].forEach(n=>{const b=document.createElement('button');b.className='carChoice';b.textContent=n;b.onclick=()=>{state.model=n;msg(n+' seçildi');closeMenu()};el.appendChild(b)})
}
function upgrade(type){
 const cost={engine:2000,brake:1500,tire:1200,suspension:1800}[type];
 if(state.money<cost)return msg('Yeterli para yok');
 state.money-=cost;state.upgrades[type]++;updateHUD();msg(type+' yükseltildi');
}
function paintCar(v){state.paint=v;body.material.color.set(v);hood.material.color.set(v)}
function reverseCamera(){state.cameraReverse=!state.cameraReverse;msg('Kamera yönü değişti')}
document.getElementById('sens').oninput=e=>state.cameraSensitivity=+e.target.value;
function startMission(){
 state.mission={x:Math.random()*300-150,z:Math.random()*300-150,reward:1000+Math.floor(Math.random()*1500)};
 marker.position.set(state.mission.x,.12,state.mission.z);marker.visible=true;msg('Görev başladı: yeşil işarete git');
}

/* Physics */
function getGearRatio(){
 const r={R:-.55,'1':.55,'2':.72,'3':.9,'4':1.05,'5':1.2,'N':0};
 return r[state.gear]||0;
}
function physics(dt){
 const ratio=getGearRatio();
 const enginePower=(28+state.upgrades.engine*4);
 let accel=state.throttle*enginePower*ratio;
 if(state.clutch && state.gear!=='N') accel*=.18;
 if(state.gear==='N')accel=0;
 const resistance=.012*state.speed*state.speed + .65;
 state.speed += (accel-resistance* Math.sign(state.speed)-state.brake*35)*dt;
 if(state.handbrake)state.speed*=Math.pow(.82,dt*60);
 state.speed=Math.max(-12,Math.min(48,state.speed));
 const steer=state.steering*(.7+Math.min(Math.abs(state.speed)/35,.8));
 car.rotation.y += steer*state.speed*.025*dt;
 car.translateZ(-state.speed*dt);
 fuelBurn=(Math.abs(state.speed)*.00065+state.throttle*.0035)*dt;
 state.fuel=Math.max(0,state.fuel-fuelBurn);
 if(state.fuel<=0){state.throttle=0;state.speed*=.99}
 /* keyboard */
 state.throttle=Math.max(state.throttle,keys['w']||keys['arrowup']?1:0);
 state.brake=Math.max(state.brake,keys['s']||keys['arrowdown']?1:0);
 if(keys['a']||keys['arrowleft'])state.steering=-1;
 else if(keys['d']||keys['arrowright'])state.steering=1;
 else if(!document.querySelector('#left:active')&&!document.querySelector('#right:active'))state.steering=0;
}
let fuelBurn=0;

/* Collision / traffic */
function collision(){
 for(const t of traffic){
   const d=car.position.distanceTo(t.position);
   if(d<3){
     state.damage=Math.min(100,state.damage+0.7);
     state.speed*=-.25;
     t.position.x+=Math.sin(car.rotation.y)*3;t.position.z+=Math.cos(car.rotation.y)*3;
   }
 }
 if(Math.abs(car.position.x)>340||Math.abs(car.position.z)>340){
   car.position.x=Math.max(-330,Math.min(330,car.position.x));
   car.position.z=Math.max(-330,Math.min(330,car.position.z));
   state.damage=Math.min(100,state.damage+.03);
 }
}
function updateTraffic(dt){
 traffic.forEach(t=>{
   if(t.userData.axis==='z')t.position.z+=t.userData.speed*dt;
   else t.position.x+=t.userData.speed*dt;
   if(t.position.x>320||t.position.z>320){t.position.x=t.position.x>320?-320:t.position.x;t.position.z=t.position.z>320?-320:t.position.z}
 });
}

/* Time */
let tod=12;
function updateDay(dt){
 tod=(tod+dt*.08)%24;
 const a=(tod/24)*Math.PI*2;
 sun.position.set(Math.cos(a)*120,Math.sin(a)*150,60);
 sun.intensity=Math.max(.15,Math.sin(a)*1.5+.2);
 const night=sun.intensity<.45;
 scene.background.set(night?0x101a2b:state.weather==='rain'?0x66727e:0x82b5dc);
 scene.fog.color.set(night?0x101a2b:state.weather==='rain'?0x66727e:0x82b5dc);
}
function updateRain(dt){
 if(!rain.visible)return;
 const p=rain.geometry.attributes.position.array;
 for(let i=0;i<rainCount;i++){p[i*3+1]-=55*dt;if(p[i*3+1]<0)p[i*3+1]=100}
 rain.geometry.attributes.position.needsUpdate=true;
}

/* Camera */
function updateCamera(){
 const target=new THREE.Vector3();
 const offsets=[
   new THREE.Vector3(0,4.5,8),
   new THREE.Vector3(0,2.3,4.5),
   new THREE.Vector3(0,8,14)
 ];
 const off=offsets[state.cameraMode].clone().applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
 target.copy(car.position).add(off);
 camera.position.lerp(target,.12);
 camera.lookAt(car.position.x,car.position.y+1,car.position.z);
}

/* Mission */
function updateMission(){
 if(!state.mission)return;
 const d=Math.hypot(car.position.x-state.mission.x,car.position.z-state.mission.z);
 if(d<6){
   state.money+=state.mission.reward;msg('Görev tamamlandı +₺'+state.mission.reward);
   state.mission=null;marker.visible=false;
 }
}
/* Fuel station */
function refuel(){
 const d=car.position.distanceTo(station.position);
 if(d<10 && state.fuel<99 && state.money>=50){
   state.money-=50;state.fuel=Math.min(100,state.fuel+8);
 }
}
/* HUD */
function updateHUD(){
 document.getElementById('speed').textContent=Math.round(Math.abs(state.speed)*3.6)+' km/h';
 document.getElementById('gear').textContent=state.gear;
 document.getElementById('fuelFill').style.width=state.fuel+'%';
 document.getElementById('damageFill').style.width=(100-state.damage)+'%';
 document.getElementById('money').textContent='₺ '+Math.floor(state.money).toLocaleString('tr-TR');
}

/* Save */
function save(){
 localStorage.setItem('tofasSimulatorSave',JSON.stringify(state));
}
function load(){
 try{const s=JSON.parse(localStorage.getItem('tofasSimulatorSave'));if(s)Object.assign(state,s)}catch(e){}
 body.material.color.set(state.paint);hood.material.color.set(state.paint);
}
load();

/* Main */
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 physics(dt);updateTraffic(dt);collision();updateDay(dt);updateRain(dt);updateMission();refuel();updateCamera();updateHUD();
 if(Math.random()<.01)save();
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
startMission();
requestAnimationFrame(loop);
</script>
</body>
</html>
